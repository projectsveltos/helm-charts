# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: dashboard OIDC authentication
templates:
  - templates/deployment.yaml
tests:
  - it: does not render any OIDC environment variable by default
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: dashboard
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OIDC_ISSUER")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OIDC_CLIENT_ID")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OIDC_REDIRECT_URI")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OIDC_SCOPE")]
  - it: renders issuer and client ID when the oidc section is set
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: dashboard
    set:
      auth.oidc.issuer: https://oidc.example/realms/sveltos
      auth.oidc.clientId: sveltos-dashboard
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
            value: https://oidc.example/realms/sveltos
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_ID
            value: sveltos-dashboard
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OIDC_REDIRECT_URI")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OIDC_SCOPE")]
  - it: renders the optional redirect URI and scopes when they are set
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: dashboard
    set:
      auth.oidc.issuer: https://oidc.example/realms/sveltos
      auth.oidc.clientId: sveltos-dashboard
      auth.oidc.redirectUri: https://dashboard.example/oidc-callback
      auth.oidc.scopes: openid profile email offline_access
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_REDIRECT_URI
            value: https://dashboard.example/oidc-callback
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_SCOPE
            value: openid profile email offline_access
