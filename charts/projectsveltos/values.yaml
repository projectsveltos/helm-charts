global:
  registry: docker.io
  useDigest: false
  capiOnboardAnnotation: ""
  imagePullSecrets: []
    # - name: my-registry-secret
  additionalLabels: {}
  enableNatsWatcher: false
  serviceAccountAnnotations: {}
  # -- NodeSelector applied to every Deployment and Job of this chart. A component's own nodeSelector is merged over it (same key: the component wins). Agents deployed in managed clusters are not affected: use their patch ConfigMaps.
  nodeSelector: {}
accessManager:
  enabled: true
  annotations: {}
  labels: {}
  podLabels: {}
  podAnnotations: {}
  manager:
    args:
      - --diagnostics-address=:8443
      - --v=5
    extraArgs: {}
    extraEnv: []
    extraVolumes: []
    # @schema skipProperties:true;additionalProperties:true
    # -- The SecurityContext for the containers
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      # -- The Docker registry. Defaults to global.registry if empty.
      registry: ""
      # -- Docker image repository
      repository: projectsveltos/access-manager
      tag: v1.16.0
      digest: sha256:3518240977ab0ec695e28236cb13bc055591da8dc5f641fce3697a25863fa0fb
    # @schema skipProperties:true;additionalProperties:true
    # -- Resource requests and limits
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 128Mi
  nodeSelector: {}
  # @schema skipProperties:true;additionalProperties:true
  # -- The SecurityContext for the pod
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  tolerations: []
  serviceAccount:
    annotations: {}
