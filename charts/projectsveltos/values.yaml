global:
  registry: docker.io
  useDigest: false
  capiOnboardAnnotation: ""
  imagePullSecrets: []
    # - name: my-registry-secret
  additionalLabels: {}
  enableNatsWatcher: false
  serviceAccountAnnotations: {}
  # -- NodeSelector applied to every Deployment and Job of this chart. A component's own nodeSelector is merged over it (same key: the component wins). Agents deployed in managed clusters are not affected: use their patch ConfigMaps.
  nodeSelector: {}
accessManager:
  enabled: true
  annotations: {}
  labels: {}
  podLabels: {}
  podAnnotations: {}
  manager:
    args:
      - --diagnostics-address=:8443
      - --v=5
    extraArgs: {}
    extraEnv: []
    extraVolumes: []
    # @schema skipProperties:true;additionalProperties:true
    # -- The SecurityContext for the containers
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      # -- The Docker registry. Defaults to global.registry if empty.
      registry: ""
      # -- Docker image repository
      repository: projectsveltos/access-manager
      tag: v1.17.0
      digest: sha256:69f3ee3f4bdf7b746027b4f4217c6b6ec3610690059cc8f4d3f6006cc3ae13ea
    # @schema skipProperties:true;additionalProperties:true
    # -- Resource requests and limits
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 128Mi
  nodeSelector: {}
  # @schema skipProperties:true;additionalProperties:true
  # -- The SecurityContext for the pod
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  tolerations: []
  serviceAccount:
    annotations: {}
