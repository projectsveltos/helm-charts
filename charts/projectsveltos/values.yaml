  serviceMonitor:
    # -- File holding the bearer token used to scrape metrics. Ignored when authorization is set.
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    # -- Authorization for the ServiceMonitor endpoints, used instead of bearerTokenFile when set. Needed by scrapers rejecting bearerTokenFile (for instance Grafana Alloy 1.19+). The referenced Secret must be in the release namespace.
    authorization: {}
    #  type: Bearer
    #  credentials:
    #    name: sveltos-metrics-token
    #    key: token
    # -- TLS configuration of the ServiceMonitor endpoints. The metrics endpoints use a self-signed certificate: set insecureSkipVerify to false (or null to drop it) and provide a CA (for instance ca.secret) to verify it.
    tlsConfig:
      insecureSkipVerify: true
