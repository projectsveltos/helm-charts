prometheus:
  enabled: false
  serviceMonitor:
    # -- File holding the bearer token used to scrape metrics. Ignored when authorization is set.
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    # -- Authorization for the ServiceMonitor endpoints, used instead of bearerTokenFile when set. Needed by scrapers rejecting bearerTokenFile (for instance Grafana Alloy 1.19+). The referenced Secret must be in the release namespace.
    authorization: {}
    #  type: Bearer
    #  credentials:
    #    name: sveltos-metrics-token
    #    key: token
    # -- TLS configuration of the ServiceMonitor endpoints. The metrics endpoints use a self-signed certificate: set insecureSkipVerify to false (or null to drop it) and provide a CA (for instance ca.secret) to verify it.
    tlsConfig:
      insecureSkipVerify: true
agent:
  # -- Set to false to not deploy sveltos-agent. The classifier-manager, addon-controller and shard-controller are started with the disable-sveltos-agent flag set, and event-manager and healthcheck-manager are not deployed since they only work with sveltos-agent. Classifier, EventSource/EventTrigger, HealthCheck/ClusterHealthCheck and the reloader feature of ClusterProfile/Profile do not work. Turning it off does not remove a sveltos-agent that is already deployed.
  enabled: true
  managementCluster: false
telemetry:
  disabled: false
