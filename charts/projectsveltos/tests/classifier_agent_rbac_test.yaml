# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: classifier role for sveltos-agent in the management cluster
templates:
  - templates/classifier-role-sveltos-agent-in-mgmt-cluster-rbac.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0
  - it: is rendered in agentless mode
    set:
      agent.managementCluster: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: classifier-role-sveltos-agent-in-mgmt-cluster
  - it: lets the classifier manage the services and ConfigMaps of the agents in agentless mode
    set:
      agent.managementCluster: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - services
              - configmaps
            verbs:
              - '*'
  - it: lets the classifier manage the Deployments of the agents in agentless mode
    set:
      agent.managementCluster: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - deployments
            verbs:
              - '*'
