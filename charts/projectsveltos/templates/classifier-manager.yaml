apiVersion: v1
kind: Service
metadata:
  name: classifier-manager
  namespace: {{ .Release.Namespace | quote }}
  labels:
    control-plane: classifier
  {{- include "projectsveltos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.classifierManager.type }}
  selector:
    control-plane: classifier
    {{- include "projectsveltos.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.classifierManager.ports | toYaml | nindent 2 }}
{{ if .Values.prometheus.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: classifier-manager
  namespace: {{ .Release.Namespace | quote }}
  labels:
  {{- with .Values.classifierManager.serviceMonitor.additionalLabels -}}
    {{- toYaml . | nindent 4 -}}
  {{- end -}}
  {{- include "projectsveltos.labels" . | nindent 4 }}
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    path: /metrics
    port: metrics
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  namespaceSelector:
    matchNames:
    - '{{ .Release.Namespace }}'
  selector:
    matchLabels:
      control-plane: classifier
{{ end }}
